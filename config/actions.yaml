active_bank: bank_a
switch_bindings:
  key_0: bank_a
  key_2: ai
  pad_4: ai_2
banks:
  bank_a:
    name: Home
    bindings:
    - control: pad_1
      type: trigger
      action: launch_program
      params:
        path: C:/Windows/System32/notepad.exe
    - control: knob_1
      type: continuous
      action: set_system_volume
      params: {}
    - control: pad_6
      type: trigger
      action: launch_program
      params:
        path: C:/Program Files (x86)/Kakao/KakaoTalk/KakaoTalk.exe
    - control: pad_7
      type: trigger
      action: launch_program
      params:
        path: C:\Program Files\Google\Chrome\Application\chrome.exe
    - control: joystick_x
      type: continuous
      action: scroll_horizontal
      params:
        sensitivity: 1.0
    - control: joystick_y
      type: continuous
      action: scroll_vertical
      params:
        sensitivity: 1.0
  ai:
    name: AI
    bindings:
    - control: joystick_x
      type: continuous
      action: scroll_horizontal
      params:
        sensitivity: 1.0
    - control: joystick_y
      type: continuous
      action: scroll_vertical
      params:
        sensitivity: 1.0
  ai_2:
    name: AI
    bindings:
    - control: joystick_x
      type: continuous
      action: scroll_horizontal
      params:
        sensitivity: 1.0
    - control: joystick_y
      type: continuous
      action: scroll_vertical
      params:
        sensitivity: 1.0
